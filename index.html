<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#243d34" />
    <meta name="description" content="Nag — a practice coach that helps you plan the week, check in daily, and nudge you when a session starts or you fall behind." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Nag" />
    <title>Nag</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/png" href="icons/favicon.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <div id="app">
      <header class="app-header">
        <div>
          <h1>Nag</h1>
          <div class="sub" id="header-sub">with Reed</div>
        </div>
      </header>
      <main id="main"></main>
      <nav class="tabbar" aria-label="Main">
        <button type="button" data-tab="today" aria-current="page">Today</button>
        <button type="button" data-tab="week">Week</button>
        <button type="button" data-tab="setup">Setup</button>
        <button type="button" data-tab="settings">Settings</button>
      </nav>
    </div>
    <div id="nag-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="nag-title"></div>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
